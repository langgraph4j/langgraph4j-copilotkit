name: Deploy New SNAPSHOT

on:
  workflow_dispatch:
#  push:
#    branches:
#      - develop
#    paths:
#      - '**/pom.xml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    name:  deploy
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '21'
          java-package: jdk
      - name: Check for SNAPSHOT version
        id: check-snapshot
        run: |
          VERSION=$(mvn -N help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ $VERSION == *"-SNAPSHOT" ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
            # echo "::set-output name=is_snapshot::true"
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
            # echo "::set-output name=is_snapshot::false"
          fi
      - name: Build and Deploy SNAPSHOT
        if: steps.check-snapshot.outputs.is_snapshot == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}
          OSS_SONATYPE_TOKEN: ${{ secrets.OSS_SONATYPE_TOKEN }}
        run: mvn clean install && mvn -pl 'langgraph4j-ag-ui-sdk' -B clean source:jar javadoc:jar install central-publishing:publish --file pom.xml -s settings-template.xml